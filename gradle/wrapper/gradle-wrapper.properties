# -----------------------------------------------------------------------------------------
# THE DOWNLOAD LOCATION (Where to save the engine)
# These lines tell the computer where to permanently save the downloaded building software
# on your computer's hard drive so it doesn't have to download it every single time you code.
# "GRADLE_USER_HOME" is a hidden folder usually located in your computer's user directory.
# -----------------------------------------------------------------------------------------
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# -----------------------------------------------------------------------------------------
# THE DOWNLOAD LINK (Which version to use)
# This is the most important line in the file. It is the direct internet link to download
# the exact version of the Gradle building engine (Version 8.14.5) needed for this app.
# -----------------------------------------------------------------------------------------
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip